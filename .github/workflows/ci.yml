name: CI

on:
  pull_request:
  push:
    branches: [main]

# A branch with an open PR would otherwise build twice, and an amended push
# would race its own predecessor.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the Vercel runtime; a green build on another major proves little.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run security:secrets
      # The reader pages fall back to an empty state when Supabase env is absent,
      # so the build is a real compile check without production secrets.
      - run: npm run build
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Typecheck mobile
        run: npm run typecheck
        working-directory: mobile
